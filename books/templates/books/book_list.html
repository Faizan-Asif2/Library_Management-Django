{% block content %}

<h1>{{ page_title|title }}</h1>

<table>

    <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Price</th>
            <th>Copies</th>
        </tr>
    </thead>

    <tbody>

        {% for book in books %}

        <tr>

            <td>{{ forloop.counter }}</td>

            <td>{{ book.tittle }}</td>

            <td>{{ book.author }}</td>

            <td>{{ book.category }}</td>

            <td>{{ book.price|floatformat:2 }}</td>

            <td>{{ book.copy }}</td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="6">
                No Members found!
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
