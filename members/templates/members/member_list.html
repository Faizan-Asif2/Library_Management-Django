{% block content %}

<h1>{{ page_title|title }}</h1>

<p>Available Members: {{ members|length }}</p>

<table>

    <thead>
        <tr>
            <th>id</th>
            <th>Name</th>
            <th>Membership</th>
            <th>Book Issued</th>
        </tr>
    </thead>

    <tbody>

        {% for member in members %}

        <tr>

            <td>{{ forloop.counter }}</td>

            <td>{{ member.name }}</td>

            <td>{{ member.membership }}</td>

            <td>{{ member.book_issued }}</td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="6">
                No Members found!
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
